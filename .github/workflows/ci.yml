name: CI
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress jobs if a developer pushes a new commit to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so the prettier "changed files" merge-base resolves.
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Keeps your runners extremely fast by caching node_modules

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🎨 Check formatting (changed files only)
        env:
          PRETTIER_BASE: origin/${{ github.base_ref || github.ref_name }}
        run: |
          git fetch origin "${{ github.base_ref || github.ref_name }}" --depth=1 || true
          node scripts/format-changed.mjs --check

      - name: 🧭 Generate Expo Router types
        run: npx expo customize tsconfig.json

      - name: 🧼 Lint code
        run: npx expo lint

      - name: 📐 Type check (TypeScript)
        run: npm run typecheck

      - name: 🧪 Run tests
        run: npm test
