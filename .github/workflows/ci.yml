name: CI
# No step writes to the PR; keep the token read-only.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress jobs if a developer pushes a new commit to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so the prettier "changed files" merge-base resolves.
          fetch-depth: 0

      - name: 🖥️ Capture runner image
        id: runner-image
        run: |
          . /etc/os-release
          echo "image-os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Cache npm's package tarballs for cold installs.

      - name: 📦 Restore root dependencies
        id: cache-root-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-node.outputs.node-version }}-${{ steps.runner-image.outputs.image-os }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc') }}

      - name: 📦 Install dependencies
        if: steps.cache-root-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: 🔧 Prepare hooks after cache hit
        if: steps.cache-root-node-modules.outputs.cache-hit == 'true'
        run: npm run prepare

      - name: 🔐 Audit cached dependencies
        if: steps.cache-root-node-modules.outputs.cache-hit == 'true'
        continue-on-error: true
        run: npm audit # Keep baseline npm ci audit findings informational.

      - name: 🎨 Check formatting (changed files only)
        env:
          PRETTIER_BASE: origin/${{ github.base_ref || github.ref_name }}
        run: |
          git fetch origin "${{ github.base_ref || github.ref_name }}" --depth=1 || true
          node scripts/format-changed.mjs --check

      - name: 🧭 Generate Expo Router types
        run: npx expo customize tsconfig.json

      - name: 🧼 Lint code
        run: npx expo lint

      - name: 📐 Type check (TypeScript)
        run: npm run typecheck

      - name: 🧪 Run tests
        run: npm test

  functions-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefer-offline
      - run: npm run build
      - run: npm test -- --runInBand

  rules-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: 🖥️ Capture runner image
        id: runner-image
        run: |
          . /etc/os-release
          echo "image-os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: 📦 Restore root dependencies
        id: cache-root-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-node.outputs.node-version }}-${{ steps.runner-image.outputs.image-os }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 📦 Install dependencies
        if: steps.cache-root-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
      - name: 🔧 Prepare hooks after cache hit
        if: steps.cache-root-node-modules.outputs.cache-hit == 'true'
        run: npm run prepare
      - name: 🔐 Audit cached dependencies
        if: steps.cache-root-node-modules.outputs.cache-hit == 'true'
        continue-on-error: true
        run: npm audit # Keep baseline npm ci audit findings informational.
      - name: 🔥 Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm run test:rules
      - run: npm ci --prefix functions --prefer-offline
      - run: npm run test:organizations:emulator
