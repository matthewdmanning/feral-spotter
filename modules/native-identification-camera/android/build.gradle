plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nativeidentificationcamera'
version = '1.0.0'

android {
  namespace 'expo.modules.nativeidentificationcamera'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.camera:camera-core:1.6.2'
  implementation 'androidx.camera:camera-camera2:1.6.2'
  implementation 'androidx.camera:camera-lifecycle:1.6.2'
  implementation 'androidx.camera:camera-view:1.6.2'

  // Live detector: LiteRT 1.4.2, the classic Interpreter plus GPU delegate.
  // LiteRT 2.x (CompiledModel) is built with Kotlin 2.3+ metadata, which this
  // project's Kotlin 2.1 compiler cannot read. See LiveDetector.kt.
  implementation 'com.google.ai.edge.litert:litert:1.4.2'
  implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
  implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.2'
}
