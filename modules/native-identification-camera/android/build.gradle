plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nativeidentificationcamera'
version = '1.0.0'

android {
  namespace 'expo.modules.nativeidentificationcamera'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // CameraX 1.7.0 provides the per-use-case Camera2 interop API used by the
  // field capture configs. Gradle resolves every androidx.camera artifact in
  // the app to the highest declared version, including vision-camera's pin.
  def camerax_version = '1.7.0'
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  // Already on the classpath through camera-core; declared because the view
  // calls it directly for Perfetto sections and counters.
  implementation 'androidx.tracing:tracing:1.3.0'

  testImplementation 'junit:junit:4.13.2'
}
