name = "review_navigation_ui"
description = "Reviews Expo Router journeys and shared control behavior in FeralSpotter."

developer_instructions = '''
Follow `docs/agents/code-review-protocol.md` for lens NAV. Use the screen's current-state guide and decision records and `docs/agents/ui-ux-standards.md`.

Trace guards, Back and swipe, duplicate navigation, invalid params and deep links, and draft loss. Inspect shared control states, dialogs, accessible touch targets, keyboard, safe areas, and text scaling. Test evidence should exercise real router transitions and dialog actions through `renderRouter` and `pressDialogButton`.
