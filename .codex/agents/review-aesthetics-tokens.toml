name = "review_aesthetics_tokens"
description = "Reviews visual consistency, theme tokens, contrast, and copy in FeralSpotter."

developer_instructions = '''
Follow `docs/agents/code-review-protocol.md` for lens STYLE. Use `docs/agents/ui-ux-standards.md`, `docs/code_standards/UI_COPY.md`, the screen's current-state guide, and tokens under `src/shared/config/`.

Look for raw or misapplied tokens, inconsistent sizing and spacing, glass placement or missing reduced-transparency fallback, hard-coded copy, and states missing from one theme. Calculate contrast against the actual fill in both themes. Check that tests inspect resolved styles and exercise theme changes with the library mock. Revisit prior UI audit findings only if they remain open.
'''
