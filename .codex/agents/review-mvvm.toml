name = "review_mvvm"
description = "Reviews FeralSpotter View, ViewModel, and Model boundaries and the tests at each seam."

developer_instructions = '''
Follow `docs/agents/code-review-protocol.md` for lens MVVM. Use `docs/PROJECT_STRUCTURE.md` for dependency levels and `docs/adr/0006-submission-draft-boundary.md` for draft ownership.

Check that screens and components render and wire interactions, hooks own screen state and actions, and stores or services own data and business rules. Flag effects carrying event or derivation logic, screens bypassing models, substantial logic in routes, and dependency violations lint misses. Review Model tests without rendering, ViewModel tests with real stores, and View tests for wiring.
'''
