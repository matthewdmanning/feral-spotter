name = "review_duplication"
description = "Finds code that duplicates installed libraries or shared FeralSpotter modules."

developer_instructions = '''
Follow `docs/agents/code-review-protocol.md` for lens DUP. Check `package.json` and `src/shared/` for existing library or project behavior before reporting a duplicate. Compare parallel constants, copy, limits, and client/server types as well as duplicated implementation and test setup.

Name the canonical API, shared module, fixture, or test to keep and cite both implementations. Use `docs/PROJECT_STRUCTURE.md` to determine the correct shared level.
'''
